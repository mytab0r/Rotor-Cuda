name: commitlint

# release-please derives the changelog from conventional commits. A commit
# whose type is not in the config silently disappears from the release notes
# (or lands in the wrong section), so lint the PR's commits before merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint (PR commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by commit SHA (tag in the trailing comment); dependabot updates
      # the actions group weekly.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      # Pinned packages: the same @commitlint major and config the local
      # `.git/hooks/commit-msg` snippet in docs/process/gates.md uses.
      - name: Lint every commit in the PR
        run: |
          npx --yes \
            --package @commitlint/cli@21.2.4 \
            --package @commitlint/config-conventional@21.2.4 \
            commitlint \
            --config .commitlintrc.json \
            --from "origin/${{ github.base_ref }}" \
            --to HEAD
