name: selfupdate-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, feat/rust-port]
    paths:
      - 'src/selfupdate.rs'
      - 'tests/selfupdate.rs'
      - '.github/workflows/selfupdate-check.yml'

jobs:
  # version_cmp and the release-asset parsing are covered by the Rust port's
  # tests (the C++ SelfUpdate.cpp self-test was removed with the application).
  selfupdate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run self-update tests
        run: cargo test --test selfupdate
