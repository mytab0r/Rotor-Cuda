name: gpu-bsgs-compile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths: &gpu-paths
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/gpu.rs'
      - 'src/gpu_search.rs'
      - 'src/gpu_plan.rs'
      - 'src/filter.rs'
      - 'src/engine.rs'
      - 'src/lib.rs'
      - 'src/main.rs'
      - 'src/cli.rs'
      - 'src/bsgs.rs'
      - 'tests/gpu_address.rs'
      - 'tests/gpu_bsgs.rs'
      - 'Rotor-Cuda/bsgs/BsgsGpu.cu'
      - 'Rotor-Cuda/bsgs/BsgsGpuAbi.cu'
      - 'Rotor-Cuda/bsgs/BsgsGpu.h'
      - 'Rotor-Cuda/GPU/GpuAddressAbi.cu'
      - 'Rotor-Cuda/GPU/GPUMath.h'
      - 'Rotor-Cuda/GPU/GPUCompute.h'
      - 'Rotor-Cuda/GPU/GPUHash.h'
      - '.github/workflows/gpu-bsgs-compile.yml'
  push:
    branches: [main, feat/rust-port]
    paths: *gpu-paths

# GitHub-hosted runners have NO GPU, so this job proves the real build path:
# build.rs locates nvcc, compiles the CUDA translation units, and the Rust
# binaries/tests link them against cudart. Device EXECUTION is verified on an
# NVIDIA host (the opt-in self-hosted `device-run` job below).
jobs:
  rust-gpu-build:
    runs-on: windows-2022
    # A wedged hosted runner previously sat in one step for over 20 minutes;
    # fail the job instead of holding a PR for hours.
    timeout-minutes: 45
    env:
      # Release parity: the same arch set the GPU release workflow publishes.
      # sm_120 needs CUDA 12.8+; sm_100 is Blackwell datacenter.
      ROTOR_CUDA_ARCHS: '52,75,80,86,89,90,100,120'
    steps:
      - uses: actions/checkout@v4

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Locate MSVC cl.exe
        id: cl
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cl = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $bin = Join-Path $cl.FullName "bin\Hostx64\x64"
          if (-not (Test-Path (Join-Path $bin "cl.exe"))) { throw "cl.exe not found under $bin" }
          "clbin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "cl.exe dir: $bin"

      - uses: dtolnay/rust-toolchain@stable

      # NVCC_CCBIN is set per step: the `steps` context is not available in a
      # job-level `env:` block, so the output of the cl.exe locator above is
      # passed explicitly to every cargo invocation that runs build.rs.
      - name: Build with gpu feature (release, static cudart)
        env:
          NVCC_CCBIN: ${{ steps.cl.outputs.clbin }}
        run: cargo build --release --features gpu --verbose

      - name: Run gpu tests (device tests skip on hosted runners)
        env:
          NVCC_CCBIN: ${{ steps.cl.outputs.clbin }}
        run: cargo test --features gpu --verbose

      - name: Release smoke (hosted runner has no GPU)
        shell: pwsh
        env:
          CLBIN: ${{ steps.cl.outputs.clbin }}
        run: |
          $exe = "target/release/rotor.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed with exit code $LASTEXITCODE" }

          # -l without a device must fail loudly (exit 2) rather than crash.
          $out = (& $exe -l 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 2) { throw "-l expected exit code 2 without a GPU, got $code" }
          if ($out -notmatch 'Error') { throw "-l printed no Error line: $out" }

          # Self-contained: static cudart leaves no cudart DLL import behind.
          $deps = & (Join-Path $env:CLBIN "dumpbin.exe") /dependents $exe | Out-String
          if ($deps -match '(?i)cudart') {
            throw "rotor-gpu.exe still imports a cudart DLL`n$deps"
          }
          Write-Host "no cudart DLL imports"

      - name: Build default features
        run: cargo build --verbose

      - name: Test default features
        run: cargo test --verbose

  device-run:
    # Opt-in: only runs on a self-hosted runner labelled 'gpu'. On GitHub-hosted
    # infra (no GPU) there is no such runner, so this job is simply never picked
    # up -- it never blocks the compile gate above. Evidence from a real run is
    # committed at Rotor-Cuda/bsgs/GPU_SMOKE.md (RTX 5070, 65536 steps, 0 mismatch).
    runs-on: [self-hosted, gpu]
    if: ${{ false }}  # flip to vars.HAS_GPU_RUNNER once a runner is registered
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Build + run GPU BSGS device smoke
        working-directory: Rotor-Cuda
        run: |
          ARCH=$(nvcc --list-gpu-arch | tail -1 | sed 's/compute/sm/')
          nvcc bsgs/gpu_smoke.cu bsgs/BsgsGpu.cu -gencode arch=${ARCH/sm/compute},code=$ARCH             -std=c++14 -I. -lgmp -o gpu_smoke
          ./gpu_smoke 4 8
          ./gpu_smoke 32 64
          ./gpu_smoke 256 256

      - name: Build + run GPU BSGS CLI self-test
        working-directory: Rotor-Cuda
        run: |
          ARCH=sm_120
          CXXFLAGS="-std=c++14 -O2 -m64 -mssse3 -msse4.1 -Wno-write-strings -I. -DWITHGPU"
          mkdir -p /tmp/bsgs-gpu-obj
          for src in Int.cpp IntMod.cpp IntGroup.cpp Point.cpp SECP256K1.cpp Random.cpp Timer.cpp Base58.cpp bsgs/BsgsCpu.cpp bsgs/bsgs_gpu_selftest.cpp; do
            obj="/tmp/bsgs-gpu-obj/$(basename "$src" .cpp).o"
            g++ $CXXFLAGS -c "$src" -o "$obj"
          done
          for src in hash/sha256.cpp hash/ripemd160.cpp hash/sha512.cpp hash/sha256_sse.cpp hash/ripemd160_sse.cpp hash/keccak160.cpp; do
            obj="/tmp/bsgs-gpu-obj/$(basename "$src" .cpp).o"
            g++ $CXXFLAGS -c "$src" -o "$obj"
          done
          nvcc -std=c++14 -O2 -I. -DWITHGPU -gencode arch=compute_120,code=$ARCH \
            -c bsgs/BsgsGpu.cu -o /tmp/bsgs-gpu-obj/BsgsGpu.o
          nvcc /tmp/bsgs-gpu-obj/Base58.o /tmp/bsgs-gpu-obj/BsgsCpu.o /tmp/bsgs-gpu-obj/BsgsGpu.o \
            /tmp/bsgs-gpu-obj/Int.o /tmp/bsgs-gpu-obj/IntGroup.o /tmp/bsgs-gpu-obj/IntMod.o /tmp/bsgs-gpu-obj/Point.o \
            /tmp/bsgs-gpu-obj/Random.o /tmp/bsgs-gpu-obj/SECP256K1.o /tmp/bsgs-gpu-obj/Timer.o \
            /tmp/bsgs-gpu-obj/keccak160.o /tmp/bsgs-gpu-obj/ripemd160.o /tmp/bsgs-gpu-obj/ripemd160_sse.o \
            /tmp/bsgs-gpu-obj/selftest.o /tmp/bsgs-gpu-obj/sha256.o /tmp/bsgs-gpu-obj/sha256_sse.o \
            /tmp/bsgs-gpu-obj/sha512.o -lgmp -o bsgs_gpu_selftest
          ./bsgs_gpu_selftest

      - name: Build + run GPU kangaroo device smoke
        working-directory: Rotor-Cuda
        run: |
          ARCH=sm_120
          nvcc bsgs/gpu_smoke_kangaroo.cu bsgs/BsgsGpu.cu \
            -gencode arch=compute_120,code=$ARCH -std=c++14 -I. -lgmp \
            -o gpu_smoke_kangaroo
          ./gpu_smoke_kangaroo
