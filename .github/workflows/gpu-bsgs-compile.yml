name: gpu-bsgs-compile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ ci/windows-build ]
    paths:
      - 'Rotor-Cuda/bsgs/BsgsGpu.cu'
      - 'Rotor-Cuda/bsgs/gpu_smoke.cu'
      - 'Rotor-Cuda/bsgs/gpu_smoke_kangaroo.cu'
      - 'Rotor-Cuda/bsgs/bsgs_gpu_selftest.cpp'
      - 'Rotor-Cuda/GPU/GPUMath.h'
      - '.github/workflows/gpu-bsgs-compile.yml'

# nvcc-compile-only: proves the giant-step kernel builds against real CUDA + the
# fork's device math. Hosted runners have NO GPU, so device EXECUTION stays
# UNVERIFIED until a self-hosted NVIDIA runner is wired. Compilation is the gate.
jobs:
  nvcc-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/windows-build

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Locate MSVC cl.exe
        id: cl
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cl = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $bin = Join-Path $cl.FullName "bin\Hostx64\x64"
          if (-not (Test-Path (Join-Path $bin "cl.exe"))) { throw "cl.exe not found under $bin" }
          "clbin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "cl.exe dir: $bin"

      - name: nvcc compile-only (device code, no link, no run)
        shell: pwsh
        working-directory: Rotor-Cuda
        run: |
          nvcc -c bsgs/BsgsGpu.cu -o BsgsGpu.obj `
            -ccbin "${{ steps.cl.outputs.clbin }}" `
            -gencode arch=compute_75,code=sm_75 `
            -std=c++14 -I. --Wno-deprecated-gpu-targets
          if ($LASTEXITCODE -ne 0) { throw "nvcc compile failed ($LASTEXITCODE)" }
          if (-not (Test-Path BsgsGpu.obj) -or (Get-Item BsgsGpu.obj).Length -le 0) {
            throw "BsgsGpu.obj missing or empty"
          }
          Write-Host "OK: BsgsGpu.obj = $((Get-Item BsgsGpu.obj).Length) bytes"

  device-run:
    # Opt-in: only runs on a self-hosted runner labelled 'gpu'. On GitHub-hosted
    # infra (no GPU) there is no such runner, so this job is simply never picked
    # up -- it never blocks the compile gate above. Evidence from a real run is
    # committed at Rotor-Cuda/bsgs/GPU_SMOKE.md (RTX 5070, 65536 steps, 0 mismatch).
    runs-on: [self-hosted, gpu]
    if: ${{ false }}  # flip to vars.HAS_GPU_RUNNER once a runner is registered
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/windows-build
      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Build + run GPU BSGS device smoke
        working-directory: Rotor-Cuda
        run: |
          ARCH=$(nvcc --list-gpu-arch | tail -1 | sed 's/compute/sm/')
          nvcc bsgs/gpu_smoke.cu bsgs/BsgsGpu.cu -gencode arch=${ARCH/sm/compute},code=$ARCH             -std=c++14 -I. -lgmp -o gpu_smoke
          ./gpu_smoke 4 8
          ./gpu_smoke 32 64
          ./gpu_smoke 256 256

      - name: Build + run GPU BSGS CLI self-test
        working-directory: Rotor-Cuda
        run: |
          ARCH=sm_120
          CXXFLAGS="-std=c++14 -O2 -m64 -mssse3 -msse4.1 -Wno-write-strings -I. -DWITHGPU"
          mkdir -p /tmp/bsgs-gpu-obj
          for src in Int.cpp IntMod.cpp IntGroup.cpp Point.cpp SECP256K1.cpp Random.cpp Timer.cpp Base58.cpp bsgs/BsgsCpu.cpp bsgs/bsgs_gpu_selftest.cpp; do
            obj="/tmp/bsgs-gpu-obj/$(basename "$src" .cpp).o"
            g++ $CXXFLAGS -c "$src" -o "$obj"
          done
          for src in hash/sha256.cpp hash/ripemd160.cpp hash/sha512.cpp hash/sha256_sse.cpp hash/ripemd160_sse.cpp hash/keccak160.cpp; do
            obj="/tmp/bsgs-gpu-obj/$(basename "$src" .cpp).o"
            g++ $CXXFLAGS -c "$src" -o "$obj"
          done
          nvcc -std=c++14 -O2 -I. -DWITHGPU -gencode arch=compute_120,code=$ARCH \
            -c bsgs/BsgsGpu.cu -o /tmp/bsgs-gpu-obj/BsgsGpu.o
          nvcc /tmp/bsgs-gpu-obj/Base58.o /tmp/bsgs-gpu-obj/BsgsCpu.o /tmp/bsgs-gpu-obj/BsgsGpu.o \
            /tmp/bsgs-gpu-obj/Int.o /tmp/bsgs-gpu-obj/IntGroup.o /tmp/bsgs-gpu-obj/IntMod.o /tmp/bsgs-gpu-obj/Point.o \
            /tmp/bsgs-gpu-obj/Random.o /tmp/bsgs-gpu-obj/SECP256K1.o /tmp/bsgs-gpu-obj/Timer.o \
            /tmp/bsgs-gpu-obj/keccak160.o /tmp/bsgs-gpu-obj/ripemd160.o /tmp/bsgs-gpu-obj/ripemd160_sse.o \
            /tmp/bsgs-gpu-obj/selftest.o /tmp/bsgs-gpu-obj/sha256.o /tmp/bsgs-gpu-obj/sha256_sse.o \
            /tmp/bsgs-gpu-obj/sha512.o -lgmp -o bsgs_gpu_selftest
          ./bsgs_gpu_selftest

      - name: Build + run GPU kangaroo device smoke
        working-directory: Rotor-Cuda
        run: |
          ARCH=sm_120
          nvcc bsgs/gpu_smoke_kangaroo.cu bsgs/BsgsGpu.cu \
            -gencode arch=compute_120,code=$ARCH -std=c++14 -I. -lgmp \
            -o gpu_smoke_kangaroo
          ./gpu_smoke_kangaroo
