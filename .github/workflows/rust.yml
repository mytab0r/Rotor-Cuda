name: rust

on:
  push:
    branches: ["main", "feat/rust-port"]
  pull_request:

permissions:
  contents: read

jobs:
  projects:
    name: projects-map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/check-projects.mjs
      - name: WASM ABI snapshot
        run: node scripts/check-wasm-abi.mjs
      - name: Architecture boundaries
        run: node scripts/check-boundaries.mjs
      - name: ABI and boundary gate tests
        run: node --test scripts/check-wasm-abi.test.mjs scripts/check-boundaries.test.mjs
      - name: Task-tracking unit tests
        run: node --test scripts/task-tracking.test.mjs scripts/check-task-links.test.mjs
      - name: No screenshots or test evidence committed under docs/
        run: node scripts/check-screenshots.mjs
      - name: No donor identities in tracked files
        env:
          DONOR_REFS_JSON: ${{ secrets.DONOR_REFS_JSON }}
        run: node scripts/check-donor-literals.mjs
      - name: Single source of truth (chains, providers, vendor lock, detectors)
        run: |
          node scripts/gen-ssot.mjs --check
          node scripts/check-ssot.mjs
          node scripts/gen-detector-docs.mjs --check
          node scripts/check-defect-ledger.mjs
          node scripts/check-advisories.mjs
      - name: Security advisory schema tests
        run: node --test scripts/check-advisories.test.mjs
      - run: npm --prefix deploy/cloudflare test
      - name: Affected areas (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/affected-areas.mjs

  web-seo:
    name: web-seo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Astro app
        run: npm --prefix web ci
      - name: Type-check the Astro app
        run: npm --prefix web run check
      - name: Unit tests
        run: npm --prefix web test
      - name: Build the static site
        run: npm --prefix web run build
      - name: SEO gate for the chain directory
        run: node scripts/check-seo.mjs

  build:
    name: build-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --release
      - name: Shared core unit tests
        run: cargo test --release -p rotor-core
      - name: Shared search unit tests
        run: cargo test --release -p rotor-search
      - name: Desktop parity baseline (P0)
        run: cargo test --release --test parity
      - run: cargo build --release
      - name: CLI smoke
        shell: bash
        run: |
          ./target/release/rotor --version
          ./target/release/rotor --help > /dev/null
        if: runner.os != 'Windows'
      - name: CLI smoke (Windows)
        shell: pwsh
        run: |
          ./target/release/rotor.exe --version
          ./target/release/rotor.exe --help | Out-Null
        if: runner.os == 'Windows'

  wasm:
    name: wasm-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p rotor-wasm --target wasm32-unknown-unknown --release
      - name: Check wasm artifact
        run: test -f target/wasm32-unknown-unknown/release/rotor_wasm.wasm
      - run: cargo test -p rotor-wasm
      - name: Desktop/wasm parity baseline (P0, fresh artifact)
        run: node tests/parity/parity-test.mjs target/wasm32-unknown-unknown/release/rotor_wasm.wasm
      - name: Desktop/wasm parity baseline (P0, committed artifact)
        run: node tests/parity/parity-test.mjs apps/site/rotor_wasm.wasm
      - name: Node smoke test
        run: node crates/rotor-wasm/smoke.mjs target/wasm32-unknown-unknown/release/rotor_wasm.wasm
      - name: Worker protocol test
        run: node apps/site/worker-test.mjs target/wasm32-unknown-unknown/release/rotor_wasm.wasm
