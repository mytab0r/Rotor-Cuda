name: release-please

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the release PR and changelog without creating anything."
        type: boolean
        default: false

# release-please needs to write the release PR, its labels, the changelog
# commit, the tag and the GitHub release. The extra `actions: write` is for
# dispatching rust-release.yml after a tag is created: a tag pushed with the
# default GITHUB_TOKEN does not trigger a `push: tags` workflow.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The action has no dry-run input; the CLI it wraps does. This path is
      # manual only and prints the proposed release PR body (the changelog)
      # without touching labels, commits or tags.
      - name: Dry run (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes release-please@17.11.2 release-pr \
            --dry-run \
            --token="$GH_TOKEN" \
            --repo-url="$GITHUB_REPOSITORY" \
            --target-branch="$GITHUB_REF_NAME" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json

      - name: Open or update the release PR
        id: release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # The tag and release created above use GITHUB_TOKEN, so the `push: tags`
      # trigger of rust-release.yml will not fire. `workflow_dispatch` is one of
      # the two events GITHUB_TOKEN is allowed to trigger, so ask for it
      # explicitly and let the existing asset pipeline run on the tag.
      - name: Publish release assets for the new tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run rust-release.yml --ref "$TAG"
