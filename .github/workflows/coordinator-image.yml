name: coordinator-image

on:
  push:
    branches: ["main"]
    paths:
      ["Dockerfile", "Cargo.toml", "Cargo.lock", "build.rs", "src/**", "web/**", "crates/**", "scripts/**", ".github/workflows/coordinator-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rotor-coord:latest
            ghcr.io/${{ github.repository_owner }}/rotor-coord:${{ github.sha }}
