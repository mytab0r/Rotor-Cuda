name: coordinator-image

on:
  push:
    branches: ["main"]
    paths:
      ["Dockerfile", "Cargo.toml", "Cargo.lock", "build.rs", "src/**", "apps/site/**", "crates/**", "data/**", "scripts/**", ".github/workflows/coordinator-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build id
        id: build
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            GIT_SHA=${{ steps.build.outputs.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rotor-coord:latest
            ghcr.io/${{ github.repository_owner }}/rotor-coord:${{ github.sha }}
