name: ui

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ui-audit:
    name: ui-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the coordinator
        run: cargo build --release --bin rotor-coord
      - name: Check the defect ledger
        run: node scripts/check-defect-ledger.mjs
      - name: Check no screenshots are committed under docs/
        run: node scripts/check-screenshots.mjs
      - name: Check the detector registry and generated tables
        run: node scripts/gen-detector-docs.mjs --check
      - name: Check the security advisory SSOT and generated page
        run: |
          node scripts/check-advisories.mjs
          node --test scripts/check-advisories.test.mjs
          node apps/site/milk-sad-scan-test.mjs
          node apps/site/wallet-security-test.mjs
      - name: Check vendor-lock EOL normalization
        run: node --test scripts/vendor-lock.test.mjs
      - name: Check the generated design tokens
        run: node scripts/build-tokens.mjs --check
      - name: Check the generated chain/provider data and vendor lock
        run: |
          node scripts/gen-ssot.mjs --check
          node scripts/check-ssot.mjs
      - name: Check token usage and drift detectors
        run: node scripts/check-token-usage.mjs
      # Phase 3: the component manifests, the generated /cabinet/admin/design
      # gallery and the page-local-style rule. build-gallery --check also proves
      # the committed page matches the manifests.
      - name: Phase 3 - component contracts and the gallery
        run: |
          node scripts/build-gallery.mjs --check
          node scripts/check-components.mjs
      # ui-audit.mjs also enforces the component grammar in
      # docs/design-system/DESIGN-SYSTEM.md and audits the /cabinet/admin/design
      # gallery; --serve logs in with the token it starts the coordinator with.
      # TMPDIR keeps the screenshots and the JSON report in one artifact dir.
      - name: Prepare the audit artifact directory
        run: mkdir -p "${{ runner.temp }}/ui-audit"
      - name: Run the UI audit
        env:
          TMPDIR: ${{ runner.temp }}/ui-audit
        run: node scripts/ui-audit.mjs --serve --json "${{ runner.temp }}/ui-audit/report.json"
      # Evidence is a CI artifact, never a committed file. Upload on every run
      # (a green run still carries the screenshots a reviewer opens), and keep
      # the failing step's exit code as the gate.
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report-${{ github.run_id }}
          # Only the report and the screenshots: the Chrome profile also lives
          # under TMPDIR and must not bloat the artifact.
          path: |
            ${{ runner.temp }}/ui-audit/report.json
            ${{ runner.temp }}/ui-audit/rotor-ui-audit-*/screenshots
          retention-days: 14
          if-no-files-found: ignore
