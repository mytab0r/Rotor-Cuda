name: ui

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ui-audit:
    name: ui-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the coordinator
        run: cargo build --release --bin rotor-coord
      - name: Check the defect ledger
        run: node scripts/check-defect-ledger.mjs
      - name: Check the generated design tokens
        run: node scripts/build-tokens.mjs --check
      - name: Check token usage and drift detectors
        run: node scripts/check-token-usage.mjs
      # Phase 3: the component manifests, the generated /design gallery and the
      # page-local-style rule. build-gallery --check also proves the committed
      # page matches the manifests.
      - name: Phase 3 - component contracts and the gallery
        run: |
          node scripts/build-gallery.mjs --check
          node scripts/check-components.mjs
      # ui-audit.mjs also enforces the component grammar in
      # docs/design-system/DESIGN-SYSTEM.md and audits the /design gallery.
      - name: Run the UI audit
        run: node scripts/ui-audit.mjs --serve
      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: |
            /tmp/rotor-ui-audit-*
          if-no-files-found: ignore
