name: codeql-alerts

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  open-alerts:
    name: open code-scanning alerts
    runs-on: ubuntu-latest
    steps:
      - name: Fail when code scanning has open alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alerts=$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100")
          count=$(printf '%s' "$alerts" | jq 'length')
          if [ "$count" -gt 0 ]; then
            printf '%s' "$alerts" | jq -r '.[] | "#\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) — \(.most_recent_instance.message.text)"'
            echo "::error::$count open code-scanning alert(s); triage, fix, or dismiss with a written reason"
            exit 1
          fi
          echo "no open code-scanning alerts"
