name: links

# Weekly, non-blocking dead-link report for docs/ and web/src/. External sites
# flake and rate-limit, so a broken link never fails a pull request here: the
# run opens or updates one tracking issue instead. The PR-time link budget lives
# in the Lighthouse job; this is the long-tail document scan.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links-weekly
  cancel-in-progress: false

jobs:
  lychee:
    name: weekly dead-link report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYCHEE_VERSION: 0.24.2
      ISSUE_TITLE: "Dead links: weekly report"
      ISSUE_MARKER: "<!-- links-weekly -->"
    steps:
      # Pinned by commit SHA (tag in the trailing comment); dependabot updates
      # the actions group weekly.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install lychee (pinned release binary)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lychee.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lychee" --version
      - name: Check docs/ and web/src/ links
        id: links
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/lychee" \
            --no-progress --format markdown --max-concurrency 8 \
            --max-retries 2 --retry-wait-time 3 \
            --accept '200..=299,403,429' \
            'docs/**/*.md' \
            'docs/**/*.html' \
            'web/src/**/*.md' \
            'web/src/**/*.astro' \
            > "$RUNNER_TEMP/lychee.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/lychee.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Advisory by design: never fail the workflow.
          exit 0
      - name: Open, update or close the single tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          finding=$(gh issue list --state open --search "${ISSUE_TITLE} in:title" --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1 || true)
          if [ "${{ steps.links.outputs.status }}" = "0" ]; then
            if [ -n "$finding" ]; then
              gh issue comment "$finding" \
                --body "No dead links on $(date -u +%F). Closing; the next weekly run opens a new issue when a link breaks."
              gh issue close "$finding"
            fi
            exit 0
          fi
          report="$RUNNER_TEMP/report.md"
          {
            echo "$ISSUE_MARKER"
            echo
            echo "Weekly lychee run on $(date -u +%F): dead links under \`docs/\` and \`web/src/\`."
            echo
            echo '```text'
            head -c 55000 "$RUNNER_TEMP/lychee.log"
            echo
            echo '```'
          } > "$report"
          if [ -n "$finding" ]; then
            gh issue edit "$finding" --body-file "$report"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi
