name: pages

on:
  push:
    branches: ["main"]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

# `secrets` is not an allowed context in `jobs.<job_id>.if` (GitHub only exposes
# github/needs/vars/inputs there), so the credential check is its own job: it
# reads the secrets once, reports only a boolean, and the deploy job is skipped
# when either secret is absent. Forks and unconfigured repositories therefore
# skip instead of failing, and the build never sees the token.
jobs:
  credentials:
    name: credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check the Cloudflare credentials
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare Pages skipped::CF_API_TOKEN and CF_ACCOUNT_ID are not both configured as repository secrets."
            echo "CF secrets not configured — deploy skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  pages:
    name: build-and-deploy
    needs: credentials
    if: ${{ needs.credentials.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.deployment-url }}
      alias-url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci

      - run: npm --prefix web run check

      - run: npm --prefix web run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name rotor-site

      - name: Write the run summary
        if: ${{ steps.deploy.outcome == 'success' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "## Cloudflare Pages"
            echo ""
            echo "- Project: \`rotor-site\`"
            echo "- Deployment (preview) URL: ${DEPLOYMENT_URL:-not reported}"
            echo "- Project alias: ${ALIAS_URL:-not reported}"
            echo ""
            echo "DNS, custom domains, Worker routes and the origin cutover are not changed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
