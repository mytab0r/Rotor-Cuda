[package]
name = "rotor-wasm"
version = "2.2.1"
edition = "2024"
license = "GPL-3.0-only"
description = "WebAssembly scan core for Rotor-Cuda"

[lib]
crate-type = ["cdylib"]

[dependencies]
rotor-core = { path = "../rotor-core" }
sha2 = "0.11"
# Ethereum keystore KDFs and cipher use the digest 0.10 family (hmac/pbkdf2),
# which is why sha2 0.10 is pulled in under its own alias.
sha2_010 = { package = "sha2", version = "0.10" }
ripemd = "0.2"
sha3 = "0.11"
bs58 = "0.5"
ed25519-dalek = { version = "2", default-features = false }
blake2 = "0.10"
scrypt = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# RFC 6979 nonces are HMAC-SHA256 over the digest 0.10 family (the same HMAC
# that pbkdf2 uses); this is the only addition the signing core needs.
hmac = "0.12"
aes = "0.8"
ctr = "0.9"

[dev-dependencies]
serde_json = "1"
