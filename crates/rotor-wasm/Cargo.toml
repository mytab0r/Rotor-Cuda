[package]
name = "rotor-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "WebAssembly scan core for Rotor-Cuda"

[lib]
crate-type = ["cdylib"]

[dependencies]
sha2 = "0.11"
ripemd = "0.2"
sha3 = "0.11"
bs58 = "0.5"
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
serde_json = "1"
