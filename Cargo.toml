[package]
name = "rotor"
version = "2.7.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Rust port of the Rotor-Cuda CPU key search"

[lib]
name = "rotor"
path = "src/lib.rs"

[[bin]]
name = "rotor"
path = "src/main.rs"

[[bin]]
name = "rotor-coord"
path = "src/bin/rotor-coord.rs"

[features]
default = []
gpu = []

[dependencies]
rotor-core = { path = "crates/rotor-core" }
rotor-search = { path = "crates/rotor-search" }
ctrlc = "3"
sha2 = "0.11"
ripemd = "0.2"
sha3 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["native-tls"], default-features = false }
xorf = "0.13"
bip39 = "2"
getrandom = "0.2"
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ed25519-dalek = "2"
blake2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[workspace]
members = ["crates/rotor-core", "crates/rotor-search", "crates/rotor-wasm"]
resolver = "3"
