[package]
name = "rotor"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Rust port of the Rotor-Cuda CPU key search"

[lib]
name = "rotor"
path = "src/lib.rs"

[[bin]]
name = "rotor"
path = "src/main.rs"

[[bin]]
name = "rotor-coord"
path = "src/bin/rotor-coord.rs"

[features]
default = []
gpu = []

[dependencies]
ctrlc = "3"
sha2 = "0.11"
ripemd = "0.2"
sha3 = "0.11"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["native-tls"], default-features = false }
xorf = "0.13"
bip39 = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
