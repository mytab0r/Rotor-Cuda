# gitleaks configuration: default rules plus reviewed false positives.
#
# Every entry below is a well-known public test vector or a documentation
# placeholder, not a production secret:
#   - Bitcoin puzzle #1 (private key 1) and its WIF, compressed pubkey,
#     Ethereum address and Tron address, repeated in tests, smoke scripts and
#     one UI-audit fixture;
#   - the BIP32 test seed and three other fixed test vectors in test files;
#   - the `my-secret` placeholder in the README curl examples.
# Production keys never come from a literal: they are generated with the OS RNG
# (AGENTS.md, "Security alerts"). Regexes are prefixes so this file does not
# contain a complete secret-looking literal itself.

[extend]
useDefault = true

[allowlist]
description = "Reviewed fixture vectors and documentation placeholders; no production key."
regexes = [
  '''1BgGZ9tcN4rm9KBzDn7KprQz87SZ2''',
  '''KwDiBf89QgGbjEhKnhXJuH7LrciVrZi3''',
  '''cMahea7zqjxrtgAbB7LSGbcQUr1uX1ojuat9''',
  '''0279be667ef9dcbbac55a06295ce870b''',
  '''02c6047f9441ed7d6d3045406e95c07''',
  '''4c0883a69102937d6231471b5dbb6204fe512961''',
  '''e8f32e723decf4051aefac8e2c93c9c5b2143138''',
  '''0x4c0b6c2b4f0a5d9e8f1b2c3d4e5f60718293a4b5''',
  '''0x7E5F4552091A69125d5DfCb7b8C2659029''',
  '''TMVQGm1qAQYVdetCeGRRkTWYYrLXu''',
  '''^my-secret$''',
]
